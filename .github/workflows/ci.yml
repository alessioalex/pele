name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        id: node
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Look up successful library tests
        id: library-tests
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/pele-library-tests
          key: library-tests-${{ runner.os }}-${{ runner.arch }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('src/**', 'tests/**', '!tests/website/**', 'scripts/**', 'package.json', 'package-lock.json', 'tsconfig*.json', 'vitest*.ts', '.github/workflows/ci.yml') }}
          lookup-only: true
      - name: Run full test suite
        if: steps.library-tests.outputs.cache-hit != 'true'
        run: |
          npm test -- --reporter=verbose
          mkdir -p "$RUNNER_TEMP/pele-library-tests"
          touch "$RUNNER_TEMP/pele-library-tests/passed"
      - run: npm run build

  go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...

  website:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.8.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - run: npm ci
      - run: pnpm --dir website install --frozen-lockfile
      - run: npm run test:website
      - run: pnpm --dir website check
      - run: pnpm --dir website build
      - name: Deploy website
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: website
        run: |
          for attempt in 1 2 3; do
            if pnpm exec wrangler deploy; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi

            echo "Deployment failed; retrying in 15 seconds..."
            sleep 15
          done
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
